<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login | eVote Secure</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb; /* Modern Blue */
      --secondary: #3b82f6;
      --accent: #1d4ed8;
      --bg-light: #f8fafc;
      --white: #ffffff;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-700: #334155;
      --gray-800: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-light);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--gray-800);
    }

    /* Simple Blue Decorative Shapes */
    .bg-shape {
      position: absolute;
      z-index: -1;
      border-radius: 50%;
      background: var(--primary);
      opacity: 0.05;
      filter: blur(50px);
    }

    .shape-1 { width: 300px; height: 300px; top: -100px; left: -100px; }
    .shape-2 { width: 250px; height: 250px; bottom: -50px; right: -50px; }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--white);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--gray-200);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h2 {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .header p {
      color: var(--gray-700);
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      color: var(--gray-800);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-light);
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      color: var(--gray-800);
      font-size: 15px;
      transition: all 0.2s;
    }

    .input-group input:focus,
    .input-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      background: var(--white);
    }

    .face-verification {
      text-align: center;
      margin: 20px 0;
      padding: 15px;
      background: var(--bg-light);
      border-radius: 20px;
      border: 2px dashed var(--gray-200);
    }

    #video, #preview {
      width: 100%;
      max-width: 180px;
      height: 130px;
      border-radius: 12px;
      background: #000;
      object-fit: cover;
      margin: 0 auto;
      border: 2px solid var(--white);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      transform: scaleX(-1); /* Mirror view */
    }

    #preview { display: none; }

    .face-btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .face-btn:hover {
      background: var(--accent);
      transform: translateY(-1px);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
    }

    .login-btn:hover:not(:disabled) {
      background: var(--accent);
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
    }

    .login-btn:disabled {
      background: var(--gray-200);
      color: var(--gray-700);
      cursor: not-allowed;
      box-shadow: none;
    }

    .status-msg {
      text-align: center;
      font-size: 13px;
      margin-top: 12px;
      font-weight: 600;
      color: var(--gray-700);
    }

    .register-link {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
      color: var(--gray-700);
    }

    .register-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }

    /* Modal Styling */
    .otp-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-card {
      background: var(--white);
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .choice-btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid var(--gray-200);
      background: var(--white);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-800);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: 0.2s;
    }

    .choice-btn:hover {
      background: var(--bg-light);
      border-color: var(--primary);
      color: var(--primary);
    }
  </style>
</head>

<body>
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <main class="login-container">
    <div class="login-card">
      <div class="header">
        <h2>Welcome Back</h2>
        <p>Login to your secure eVote session</p>
      </div>

      <div class="input-group">
        <label>Institutional Email</label>
        <input type="email" id="email" placeholder="name@college.edu" required>
      </div>

      <div class="input-group">
        <label>Secure Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="input-group">
        <label>Portal Role / Scope</label>
        <select id="role">
          <option value="voter">Voter / Candidate</option>
          <option value="admin">Institutional Admin</option>
          <option value="committee">Election Committee</option>
        </select>
      </div>

      <div class="face-verification">
        <video id="video" autoplay></video>
        <img id="preview">
        <button id="captureFaceBtn" class="face-btn">Verify Identity</button>
      </div>

      <button id="loginBtn" class="login-btn" disabled>Authenticate Login</button>

      <div id="status" class="status-msg">Ready</div>

      <p class="register-link">
        New here? <a href="register">Create an Account</a>
      </p>
      <p class="register-link" style="margin-top: 10px; font-size: 13px;">
        Applied already? <a href="track" style="color: var(--gray-600);">Check Application Status</a>
      </p>
    </div>
  </main>



  <!-- OTP Verification Modal -->
  <div class="otp-modal" id="otpVerifyModal">
    <div class="modal-card">
        <h3 style="color: var(--gray-800); margin-bottom: 10px;">Identity Check</h3>
        <p id="otpMsg" style="color: var(--gray-700); font-size: 13px; margin-bottom: 15px;"></p>
        <input type="text" id="otpInput" placeholder="000000" maxlength="6"
               style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--gray-200); text-align: center; letter-spacing: 5px; font-size: 20px; font-weight: bold; margin-bottom: 15px;">
        <button id="confirmLoginBtn" class="login-btn">Confirm & Login</button>
        <div style="margin-top: 15px; font-size: 13px;">
            <button id="resendOtpBtn" disabled style="background:none; border:none; color:var(--primary); font-weight:700; cursor:pointer; opacity:0.5;">Resend OTP</button>
            <span id="resendTimer" style="color:var(--gray-700); margin-left:5px;">(60s)</span>
        </div>
    </div>
</div>

  <!-- Force Password Change Modal -->
  <div class="otp-modal" id="changePasswordModal">
    <div class="modal-card">
        <h3 style="color: var(--gray-800); margin-bottom: 10px;">🔐 Set Your Password</h3>
        <p style="color: var(--gray-700); font-size: 13px; margin-bottom: 15px;">You must set a new password before continuing.</p>
        <input type="password" id="newPwdInput" placeholder="New password (min 8 chars)"
               style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--gray-200); margin-bottom: 10px;">
        <input type="password" id="confirmPwdInput" placeholder="Confirm new password"
               style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--gray-200); margin-bottom: 15px;">
        <div id="pwdChangeMsg" style="font-size:13px; margin-bottom:10px; color:#ef4444;"></div>
        <button id="setPwdBtn" class="login-btn">Set Password & Continue</button>
    </div>
  </div>

  <canvas id="canvas" width="200" height="150" style="display:none;"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js" integrity="sha384-gzn2n++arkvyhdNLmUf1s6F5NZ8iAbZ7FhIt+Zw7Jlf1n/vNTmZ3+cYr7S4ogyco" crossorigin="anonymous"></script>
  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const preview = document.getElementById("preview");
    const loginBtn = document.getElementById("loginBtn");
    const status = document.getElementById("status");
    let modelsLoaded = false;
    let faceDescriptor = null;
    let tempLoginData = {};
    let resendTimerInterval = null;
    let lastOtpType = 'whatsapp';

    const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';

    async function loadModels() {
      status.innerText = "Initializing security protocols...";
      try {
        await faceapi.nets.tinyFaceDetector.load(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.load(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.load(MODEL_URL);
        modelsLoaded = true;
        status.innerText = "System Ready";
        status.style.color = "var(--primary)";
        navigator.mediaDevices.getUserMedia({ video: {} }).then(s => video.srcObject = s);
      } catch (err) { 
        status.innerText = "Error: Camera Offline"; 
        status.style.color = "red";
      }
    }

    let blinkCount = 0;
    let isEyesClosed = false;
    let livenessCheckActive = false;

    function getEAR(eye) {
        const dist = (p1, p2) => Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        const v1 = dist(eye[1], eye[5]);
        const v2 = dist(eye[2], eye[4]);
        const h = dist(eye[0], eye[3]);
        return (v1 + v2) / (2.0 * h);
    }

    async function captureFace() {
        if (!modelsLoaded || livenessCheckActive) return;
        livenessCheckActive = true;
        blinkCount = 0;
        isEyesClosed = false;
        status.innerText = "Analyzing... Please look straight.";
        status.style.color = "var(--primary)";
        checkLivenessLoop();
    }

    async function checkLivenessLoop() {
        if (!livenessCheckActive) return;

        const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptors();

        if (detections.length === 0) {
            status.innerText = "❌ No face detected.";
            status.style.color = "red";
            requestAnimationFrame(checkLivenessLoop);
            return;
        }

        if (detections.length > 1) {
            status.innerText = "❌ Multiple faces detected! Please ensure you are alone.";
            status.style.color = "red";
            requestAnimationFrame(checkLivenessLoop);
            return;
        }

        const landmarks = detections[0].landmarks;
        const leftEye = landmarks.getLeftEye();
        const rightEye = landmarks.getRightEye();

        const leftEAR = getEAR(leftEye);
        const rightEAR = getEAR(rightEye);
        const ear = (leftEAR + rightEAR) / 2;

        if (ear < 0.25) { 
            if (!isEyesClosed) {
                isEyesClosed = true;
                blinkCount++;
            }
        } else {
            isEyesClosed = false;
        }

        if (blinkCount >= 2 && !isEyesClosed) {
            livenessCheckActive = false;
            faceDescriptor = Array.from(detections[0].descriptor);
            
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, 200, 150);
            preview.src = canvas.toDataURL("image/png");
            preview.style.display = "block";
            video.style.display = "none";
            
            status.innerText = "✅ Biometric Match Found";
            status.style.color = "#10b981";
            loginBtn.disabled = false;
            return;
        } else {
            status.innerText = `Liveness Check: Blink Twice (${blinkCount}/2). NO SUNGLASSES.`;
            status.style.color = "var(--primary)";
        }

        requestAnimationFrame(checkLivenessLoop);
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const role = document.getElementById("role").value;

        if (!email || !password || !faceDescriptor) return alert("Please fill all fields and verify your face.");

        status.innerText = "Authenticating...";
        tempLoginData = { email, password, role, faceDescriptor, faceData: preview.src };

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': getCookie('XSRF-TOKEN')
                },
                credentials: 'include',
                body: JSON.stringify(tempLoginData)
            });

            const data = await res.json();

            if (res.status === 202 && (data.enrollmentRequired || data.otpRequired)) {
                // Enrollment Required OR Adaptive OTP Fallback
                document.getElementById('otpVerifyModal').style.display = 'flex';
                document.getElementById('otpMsg').innerText = data.msg;
                tempLoginData.isEnrollment = true; // Use this to trigger direct login resubmit with OTP
                return;
            }

            if (res.status === 200 && data.faceVerified) {
                // Face match successful, now automatically send WhatsApp OTP
                sendLoginOTP('whatsapp');
                status.innerText = "Identity Verified. Sending 2FA Code...";
            } else if (res.ok) {
                handleLoginSuccess(data);
            } else {
                if (data.rejected) {
                    status.innerHTML = `<span style="color:red;">Rejected: ${data.reason}</span><br>
                        <a href="register" style="color:var(--primary); font-weight:700; text-decoration:underline;">Refill Registration Form</a>`;
                } else {
                    alert(data.msg || "Login failed");
                    status.innerText = data.msg || "Login failed";
                    status.style.color = "red";
                }
                resetCamera();
            }
        } catch (err) {
            console.error(err);
            alert("Connection error");
            resetCamera();
        }
    }

    function resetCamera() {
        video.style.display = "block";
        preview.style.display = "none";
        preview.src = "";
        faceDescriptor = null;
        loginBtn.disabled = true;
    }

    function startResendTimer() {
        const btn = document.getElementById('resendOtpBtn');
        const timerSpan = document.getElementById('resendTimer');
        let timeLeft = 60;
        
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.style.cursor = 'not-allowed';
        
        if (resendTimerInterval) clearInterval(resendTimerInterval);
        
        resendTimerInterval = setInterval(() => {
            timeLeft--;
            timerSpan.innerText = `(${timeLeft}s)`;
            if (timeLeft <= 0) {
                clearInterval(resendTimerInterval);
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
                timerSpan.innerText = '';
            }
        }, 1000);
    }

    function closeLoginOTP() { document.getElementById('otpChoiceModal').style.display = 'none'; }

    async function sendLoginOTP(type) {
        lastOtpType = type;
        status.innerText = `Sending code to ${type}...`;
        try {
            // ALWAYS use email as the identifier for OTP storage consistency
            const identifier = tempLoginData.email;

            const res = await fetch('/api/auth/send-otp', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': getCookie('XSRF-TOKEN')
                },
                credentials: 'include',
                body: JSON.stringify({ identifier, type })
            });

            if (res.ok) {
                document.getElementById('otpVerifyModal').style.display = 'flex';
                document.getElementById('otpMsg').innerText = `Enter the code sent to your ${type}:`;
                tempLoginData.otpIdentifier = identifier;
                startResendTimer();
            } else { 
                const data = await res.json();
                alert(data.msg || "Failed to send OTP"); 
            }
        } catch (e) { alert("An error occurred"); }
    }

    async function verifyAndLogin() {
        const otpCode = document.getElementById('otpInput').value;
        if (!otpCode) return alert("Enter the OTP code.");
        
        try {
            // Simplified Flow: Always call /api/auth/login with the otpCode.
            // The backend now handles BOTH biometric/enrollment and 2FA verification.
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': getCookie('XSRF-TOKEN')
                },
                credentials: 'include',
                body: JSON.stringify({ ...tempLoginData, otpCode })
            });

            const data = await res.json();
            if (res.ok) {
                handleLoginSuccess(data);
            } else {
                alert(data.msg || "Verification failed. Check the code.");
            }
        } catch (e) { alert("An error occurred during verification."); }
    }

    function handleLoginSuccess(loginData) {
        localStorage.setItem('role', loginData.role);
        if (loginData.needsPrnUpdate) {
            localStorage.setItem('needsPrnUpdate', 'true');
        } else {
            localStorage.removeItem('needsPrnUpdate');
        }
        
        if (loginData.mustChangePassword) {
            document.getElementById('otpVerifyModal').style.display = 'none';
            document.getElementById('changePasswordModal').style.display = 'flex';
        } else {
            window.location.href = loginData.role === 'admin' ? "admin dashboard" :
                                 loginData.role === 'committee' ? "Approval" : "voter dashboard";
        }
    }

    async function changePassword() {
        const newPwd = document.getElementById('newPwdInput').value;
        const confirmPwd = document.getElementById('confirmPwdInput').value;
        const msgEl = document.getElementById('pwdChangeMsg');
        if (!newPwd || newPwd.length < 8) { msgEl.innerText = 'Password must be at least 8 characters.'; return; }
        if (newPwd !== confirmPwd) { msgEl.innerText = 'Passwords do not match.'; return; }
        try {
            const res = await fetch('/api/auth/change-password', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'X-CSRF-Token': getCookie('XSRF-TOKEN')
                },
                credentials: 'include',
                body: JSON.stringify({ newPassword: newPwd })
            });
            const data = await res.json();
            if (res.ok) {
                alert('✅ Password changed successfully! Welcome to the committee portal.');
                window.location.href = 'Approval';
            } else { msgEl.innerText = data.msg; }
        } catch (e) { msgEl.innerText = 'Failed to change password. Try again.'; }
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadModels();
        
        const captureBtn = document.getElementById("captureFaceBtn");
        const loginBtn = document.getElementById("loginBtn");
        const confirmLoginBtn = document.getElementById("confirmLoginBtn");
        const setPwdBtn = document.getElementById("setPwdBtn");

        if (captureBtn) captureBtn.addEventListener("click", captureFace);
        if (loginBtn) loginBtn.addEventListener("click", login);
        if (confirmLoginBtn) confirmLoginBtn.addEventListener("click", verifyAndLogin);
        if (setPwdBtn) setPwdBtn.addEventListener("click", changePassword);
        
        const resendBtn = document.getElementById("resendOtpBtn");
        if (resendBtn) resendBtn.addEventListener("click", () => sendLoginOTP(lastOtpType));
    });
  </script>
  <script src="js/location-check.js"></script>
</body>
</html>
