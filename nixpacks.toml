[phases.setup]
nixPkgs = ["...", "nodejs"]
aptPkgs = [
    "wget", 
    "gnupg", 
    "ca-certificates",
    "libnss3",
    "libnspr4",
    "libatk1.0-0",
    "libatk-bridge2.0-0",
    "libcups2",
    "libdrm2",
    "libxkbcommon0",
    "libxcomposite1",
    "libxdamage1",
    "libxext6",
    "libxfixes3",
    "libxrandr2",
    "libgbm1",
    "libpango-1.0-0",
    "libcairo2",
    "libasound2",
    "libglib2.0-0",
    "libdbus-1-3"
]

[phases.build]
cmds = ["npm install", "npx puppeteer install", "npm run build --if-present"]

[variables]
NODE_ENV = "production"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "false"
